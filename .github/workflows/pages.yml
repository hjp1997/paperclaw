name: Publish PaperClaw

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "site-data/**"
      - "web/**"
      - "paperclaw/**"
      - "pages.py"
      - ".github/workflows/**"
  workflow_dispatch:
  workflow_run:
    workflows: [Collect PaperClaw, Enrich PaperClaw, Analyze PaperClaw]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: paperclaw-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate paper processing
        run: python -m unittest discover -s tests -q
      - uses: actions/configure-pages@v5
      - name: Build static library
        run: python pages.py build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Publish PaperClaw

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "site-data/**"
      - "web/**"
      - "paperclaw/**"
      - "pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      refresh:
        description: "发布前重新采集指定会议"
        type: boolean
        default: false
      conferences:
        description: "会议名称，多个用英文逗号分隔"
        type: string
        default: "ICLR"
      years:
        description: "年份，多个用英文逗号分隔"
        type: string
        default: "2025"
      source:
        description: "采集来源"
        type: choice
        options: [conference, auto, crossref, dblp, openreview, ieee, usenix]
        default: conference
      analyze:
        description: "生成 AI Topic 和中文摘要总结（DeepSeek，按用量计费）"
        type: boolean
        default: false
      analysis_limit:
        description: "本轮最多分析篇数（1–1000，已完成项自动跳过）"
        type: string
        default: "50"

permissions:
  contents: read

concurrency:
  group: paperclaw-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate paper processing
        run: python -m unittest discover -s tests -q
      - name: Restore collector cache
        if: github.event_name == 'workflow_dispatch' && inputs.refresh
        uses: actions/cache@v4
        with:
          path: data/pages-cache
          key: paperclaw-collector-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            paperclaw-collector-${{ runner.os }}-
      - name: Collect public metadata
        id: collect
        if: github.event_name == 'workflow_dispatch' && inputs.refresh
        env:
          PAGES_CONFERENCES: ${{ inputs.conferences }}
          PAGES_YEARS: ${{ inputs.years }}
          PAGES_SOURCE: ${{ inputs.source }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          IEEE_API_KEY: ${{ secrets.IEEE_API_KEY }}
        run: |
          python pages.py collect --conferences "$PAGES_CONFERENCES" --years "$PAGES_YEARS" --source "$PAGES_SOURCE"
      - name: Generate topics and abstract summaries
        id: analyze
        if: github.event_name == 'workflow_dispatch' && inputs.analyze
        env:
          PAGES_CONFERENCES: ${{ inputs.conferences }}
          PAGES_YEARS: ${{ inputs.years }}
          ANALYSIS_LIMIT: ${{ inputs.analysis_limit }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python pages.py analyze --conferences "$PAGES_CONFERENCES" --years "$PAGES_YEARS" --limit "$ANALYSIS_LIMIT"
      - name: Save public JSON and analysis checkpoints
        if: "!cancelled() && github.event_name == 'workflow_dispatch' && (inputs.refresh || inputs.analyze) && steps.collect.outcome != 'failure'"
        env:
          PAGES_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-data
          if ! git diff --cached --quiet; then
            git commit -m "Update public paper metadata and analyses"
            git push origin "HEAD:$PAGES_BRANCH"
          fi
      - uses: actions/configure-pages@v5
      - name: Build static library
        run: python pages.py build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Analyze PaperClaw

on:
  workflow_dispatch:
    inputs:
      conferences:
        description: "待分析会议简称，英文逗号分隔（仅处理已采集数据）"
        type: string
        default: "ICML"
        required: true
      years:
        description: "待分析年份，英文逗号分隔"
        type: string
        default: "2026"
        required: true
      scope:
        description: "featured=特别分类（排除普通 Poster），all=全部有摘要论文"
        type: choice
        options: [featured, all]
        default: featured
      limit:
        description: "本轮最多分析篇数（1–1000，DeepSeek 按用量计费）"
        type: string
        default: "50"

permissions:
  contents: write

concurrency:
  group: paperclaw-data
  cancel-in-progress: false

jobs:
  analyze:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate paper processing
        run: python -m unittest discover -s tests -q
      - name: Analyze already collected papers
        id: analyze
        env:
          PAGES_CONFERENCES: ${{ inputs.conferences }}
          PAGES_YEARS: ${{ inputs.years }}
          ANALYSIS_LIMIT: ${{ inputs.limit }}
          ANALYSIS_SCOPE: ${{ inputs.scope }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python pages.py analyze --conferences "$PAGES_CONFERENCES" --years "$PAGES_YEARS" --limit "$ANALYSIS_LIMIT" --scope "$ANALYSIS_SCOPE"
      - name: Save analysis checkpoints
        if: "!cancelled() && (steps.analyze.outcome == 'success' || steps.analyze.outcome == 'failure')"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-data
          if ! git diff --cached --quiet; then
            git commit -m "Update precomputed paper analyses"
            git push origin HEAD:main
          fi
